name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the DMG to (optional; defaults to the pushed tag)"
        required: false

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      # Release artifacts are Apple Silicon only (see landing page: "Apple Silicon DMG").
      ARCH: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (project format requires Xcode 16+)
        run: |
          ls /Applications | grep -E '^Xcode'
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || true
          xcodebuild -version

      - name: Verify scheme is shared / discoverable
        run: |
          xcodebuild -project Wren.xcodeproj -list || true
          xcodebuild -project Wren.xcodeproj -scheme Wren -showBuildSettings \
            | grep -E 'MARKETING_VERSION|PRODUCT_BUNDLE_IDENTIFIER' || true

      - name: Build and package DMG (arm64)
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: ./scripts/make_release.sh

      - name: Determine release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create (or reuse) GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          NOTES_FILE=".github/release-notes/${TAG}.md"

          # Prefer a hand-written notes file checked in for this tag; otherwise
          # fall back to GitHub's generated commit notes.
          if [[ -f "$NOTES_FILE" ]]; then
            DMG_NAME="$(basename "$(ls dist/*.dmg | head -n 1)")"
            SHA="$(head -n 1 dist/*.dmg.sha256)"
            NOTES="$(mktemp)"
            cat "$NOTES_FILE" > "$NOTES"
            {
              printf '\n## Checksum\n\n'
              printf 'SHA-256 for `%s`:\n\n' "$DMG_NAME"
              printf '```\n%s\n```\n' "$SHA"
            } >> "$NOTES"
            gh release create "$TAG" --title "Wren $TAG" --notes-file "$NOTES" \
              || echo "Release for $TAG already exists; uploading assets."
          else
            gh release create "$TAG" --title "Wren $TAG" --generate-notes \
              || echo "Release for $TAG already exists; uploading assets."
          fi

          gh release upload "$TAG" dist/*.dmg dist/*.dmg.sha256 --clobber
